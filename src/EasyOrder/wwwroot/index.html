<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyOrder 음성주문</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: system-ui, sans-serif;
    }
    #activate {
      font-size: 8vw;
      font-weight: bold;
      padding: 6vw 8vw;
      border: 3px solid #333;
      border-radius: 16px;
      background: #f2f2f2;
      color: #000;
    }
    /* 활성화 후: 색 변경, 더 이상 반응하지 않음 */
    #activate.activated,
    #activate:disabled {
      background: #2e7d32;
      border-color: #1b5e20;
      color: #fff;
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- FR-14: 화면 가운데 음성주문활성화 버튼 -->
  <button id="activate" type="button">음성주문활성화</button>
  <script src="phone.js"></script>
</body>
</html>
